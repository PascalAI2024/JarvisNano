version: 1.0.0
# Devices Configuration
# Init order matters: IO expander first (gates downstream rails on some boards),
# PMIC second (controls panel/codec analog supplies), then display, then touch.
devices:

  - name: gpio_expander
    chip: tca9554
    type: gpio_expander
    version: default
    dependencies:
      espressif/esp_io_expander_tca9554: "*"
    config:
      max_pins: 8
      output_io_mask: [0, 1, 2, 3, 4, 5, 6, 7]
      output_io_level_mask: [0, 0, 0, 0, 0, 0, 0, 0]
      input_io_mask: NULL
    peripherals:
      - name: i2c_master
        i2c_addr: [0x40]   # TCA9554 default 7-bit 0x20 → 8-bit 0x40 (A0=A1=A2=GND)

  - name: axp2101_power_manager
    chip: axp2101
    type: custom
    version: default
    config:
      frequency: 400000
      i2c_addr: 0x34
    peripherals:
      - name: i2c_master

  # CO5300 AMOLED, 466x466, QSPI on SPI2_HOST
  - name: display_lcd
    chip: co5300
    type: display_lcd
    sub_type: spi
    version: default
    dependencies:
      espressif/esp_lcd_co5300: "*"
    config:
      x_max: 466
      y_max: 466
      need_reset: true
      io_spi_config:
        cs_gpio_num: 12
        dc_gpio_num: -1                  # not used by CO5300 QSPI (command bits in transfer header)
        spi_mode: 0
        lcd_cmd_bits: 32
        flags:
          quad_mode: true                # 4 data lines

      lcd_panel_config:
        reset_gpio_num: 39
        rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
        bits_per_pixel: 16
        # CO5300 init commands provided by setup_device.c::lcd_panel_factory_entry_t
        vendor_config: NULL
    peripherals:
      - name: spi_display

  # CST9217 capacitive touch on shared I2C bus
  - name: lcd_touch
    chip: cst9217
    type: lcd_touch_i2c
    version: default
    dependencies:
      esp_lcd_touch:
        version: "*"
        require: public
      waveshare/esp_lcd_touch_cst9217: "*"
    config:
      io_i2c_config:
        dev_addr: [0x5A]                 # CST9217 default 7-bit address
        lcd_cmd_bits: 8
        scl_speed_hz: 400000
        peripherals:
          - name: i2c_master

      touch_config:
        x_max: 466
        y_max: 466
        int_gpio_num: 11
        rst_gpio_num: 40
