version: 1.0.0
# Devices Configuration
# Init order matters: IO expander first (gates downstream rails on some boards),
# PMIC second (controls panel/codec analog supplies), then display, then touch.
devices:

  - name: gpio_expander
    chip: tca9554
    type: gpio_expander
    version: default
    dependencies:
      espressif/esp_io_expander_tca9554: "*"
    config:
      max_pins: 8
      output_io_mask: [0, 1, 2, 3, 4, 5, 6, 7]
      output_io_level_mask: [0, 0, 0, 0, 0, 0, 0, 0]
      input_io_mask: NULL
    peripherals:
      - name: i2c_master
        i2c_addr: [0x40]   # TCA9554 default 7-bit 0x20 → 8-bit 0x40 (A0=A1=A2=GND)

  - name: axp2101_power_manager
    chip: axp2101
    type: custom
    version: default
    init_skip: true                # factory AXP2101 defaults already power display/audio rails on this board
    config:
      frequency: 400000
      i2c_addr: 0x34
    peripherals:
      - name: i2c_master

  # ES8311 — speaker DAC + (unused here) onboard mic ADC. Mic ADC handled by ES7210 for AEC.
  - name: audio_dac
    chip: es8311
    type: audio_codec
    version: default
    config:
      adc_enabled: false
      dac_enabled: true
      dac_max_channel: 1
      dac_channel_mask: "1"
      dac_init_gain: 0
      mclk_enabled: true
    peripherals:
      - name: gpio_pa_control
        gain: 6
        active_level: 1
      - name: i2s_audio_out
      - name: i2c_master
        address: 0x30
        frequency: 400000

  # ES7210 — 4-channel ADC. It only DIGITIZES the AEC echo reference; echo
  # cancellation itself is software (esp-sr) — the chip has no on-chip AEC.
  # Schematic (docs/reference/aec-barge-in.md): MIC1+MIC2 = MEMS mics,
  # MIC3 = speaker echo-reference loopback (ES8311 OUTP/OUTN via ~-23.5 dB
  # pad), MIC4 = unconnected. Channel mask "0111" = MIC1|MIC2|MIC3.
  # Labels below are TDM lane order, zero-based: lane 2 carries the reference.
  - name: audio_adc
    chip: es7210
    type: audio_codec
    version: default
    config:
      adc_enabled: true
      adc_max_channel: 4
      adc_channel_mask: "0111"
      adc_channel_labels: ['MIC1', 'MIC2', 'REF', 'NC']
      adc_init_gain: 0
    peripherals:
      - name: i2s_audio_in
      - name: i2c_master
        address: 0x80
        frequency: 400000

  # 32 GB microSD via SDMMC (1-bit). Pin map from Waveshare BSP:
  # D0=GPIO3, CMD=GPIO1, CLK=GPIO2. format_if_mount_failed lets the
  # firmware reformat a card that's blank or has a non-FAT filesystem,
  # rather than panic-aborting board init.
  - name: fs_sdcard
    type: fs_fat
    sub_type: sdmmc
    version: default
    config:
      vfs_config:
        format_if_mount_failed: true
      sub_config:
        bus_width: 1
        slot_flags: "SDMMC_SLOT_FLAG_INTERNAL_PULLUP"
        pins:
          clk: 2
          cmd: 1
          d0: 3

  # CST9217 capacitive touch on shared I2C bus
  - name: lcd_touch
    chip: cst9217
    type: lcd_touch_i2c
    version: default
    dependencies:
      esp_lcd_touch:
        version: "*"
        require: public
      waveshare/esp_lcd_touch_cst9217: "*"
    config:
      io_i2c_config:
        dev_addr: [0x5A]                 # CST9217 default 7-bit address
        lcd_cmd_bits: 8
        scl_speed_hz: 400000
        peripherals:
          - name: i2c_master

      touch_config:
        x_max: 466
        y_max: 466
        int_gpio_num: 11
        rst_gpio_num: 40
