#
# Managed registry dependencies for the supported 1.75C image. Versions are
# pinned to the hardware-verified ESP-IDF 5.5.4 composition so a clean build
# does not chase registry drift. `idf.py reconfigure` pulls these dependencies;
# local `components/jr_*` sources are auto-discovered and not listed here.
dependencies:
  idf: ">=5.5.0"

  # --- L0 board bring-up ---------------------------------------------------
  # esp_board_manager generates the selected board's declared I2C/audio device
  # tree. The 1.75C owns AXP2101, ES8311, ES7210, CST9217, and QMI8658; the
  # original compatibility board additionally declares TCA9554/RTC/SDMMC.
  espressif/esp_board_manager: "==0.5.15"

  # CO5300 466x466 QSPI AMOLED panel driver (hardware.md #4/#5).
  espressif/esp_lcd_co5300: "==2.1.0"

  # CST9217 interrupt-driven capacitive touch (hardware.md #9).
  espressif/esp_lcd_touch: "==1.2.1"
  waveshare/esp_lcd_touch_cst9217: "==2.0.0"

  # --- L1 audio ------------------------------------------------------------
  # esp-sr provides the software AEC (AEC_MODE_FD_LOW_COST) — the ES7210 has no
  # on-chip AEC, it only digitizes a hardware echo reference (hardware.md #3).
  espressif/esp-sr: "==2.4.6"
  # Codec device abstraction over ES8311/ES7210 on the shared I2S0 duplex clock.
  espressif/esp_codec_dev: "==1.5.11"

  # --- L2 transport --------------------------------------------------------
  # WS client behind the L2 framer (would-block-as-backpressure). Pinned to the
  # version the v4 write-block behavior was characterised against.
  espressif/esp_websocket_client: "==1.7.0"

  # --- L5 display ----------------------------------------------------------
  # emote_gfx baked-AAF face runtime. NO canvas / no runtime framebuffer
  # (hardware.md #5) — reactivity is flash-baked AAF/EAF segments.
  espressif2022/esp_emote_gfx: "==3.0.2"
