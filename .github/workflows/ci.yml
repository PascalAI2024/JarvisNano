name: Leak Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leak-check:
    name: Secrets and public identifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Secret and identifier scan
        run: ./scripts/check-secrets.sh
