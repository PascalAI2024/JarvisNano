name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (keys, private hosts, local paths)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan the commits this push or PR adds
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Only new commits: history before the guard existed is covered by
          # docs/security/push-audit-2026-11.md and is not rewritten.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git merge-base origin/main "$HEAD" 2>/dev/null || git rev-parse "$HEAD~1")
          fi
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.21.2 detect --source . \
            --config .gitleaks.toml --redact --verbose --no-banner \
            --log-opts="$BASE..$HEAD"
