<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>JarvisNano V5</title>
<style>
:root{--bg:#070a0f;--panel:#101721;--line:#243142;--text:#e8f0f7;--muted:#8392a5;--cyan:#38d9ff;--green:#59e391;--amber:#ffc857;--red:#ff6677;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% -10%,#12314a 0,transparent 35%),var(--bg);color:var(--text);font:14px system-ui,sans-serif}.top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:14px;padding:14px clamp(14px,3vw,30px);background:#080d14e8;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.brand{font:700 15px var(--mono);letter-spacing:.14em}.brand b{color:var(--cyan)}.dot{width:10px;height:10px;border-radius:50%;background:var(--amber);box-shadow:0 0 14px currentColor}.dot.ok{background:var(--green)}.dot.bad{background:var(--red)}.auth{margin-left:auto;display:flex;gap:8px;align-items:center}.auth input{width:min(230px,35vw)}main{max-width:1400px;margin:auto;padding:22px clamp(14px,3vw,30px);display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{grid-column:span 4;background:linear-gradient(145deg,#121b27,#0d131d);border:1px solid var(--line);border-radius:13px;padding:16px;min-width:0;box-shadow:0 16px 50px #0004}.wide{grid-column:span 8}.full{grid-column:1/-1}h1,h2{margin:0}h1{font:600 clamp(24px,4vw,46px) var(--mono)}h1 b{color:var(--cyan)}h2{font:600 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}.hero p{color:var(--muted);margin:8px 0 0}.state{font:700 clamp(22px,4vw,42px) var(--mono);color:var(--cyan);text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.kv{padding:9px;background:#070b11;border:1px solid #1c2735;border-radius:8px;min-width:0}.kv small{display:block;color:var(--muted);font:10px var(--mono);text-transform:uppercase}.kv strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px;font:13px var(--mono)}pre{margin:0;max-height:260px;overflow:auto;padding:11px;background:#070b11;border:1px solid #1c2735;border-radius:8px;color:#b9c8d8;font:11px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word}input,button{border:1px solid var(--line);border-radius:8px;background:#0a111a;color:var(--text);padding:9px 11px;font:13px var(--mono)}input:focus{outline:2px solid #38d9ff44;border-color:var(--cyan)}input:disabled,button:disabled{opacity:.45;cursor:not-allowed}button{cursor:pointer}button:hover{border-color:var(--cyan);color:var(--cyan)}button.primary{background:var(--cyan);border-color:var(--cyan);color:#001018;font-weight:800}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:grid;gap:5px}.field label{font:10px var(--mono);color:var(--muted);text-transform:uppercase}.field input{width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.say{display:flex;gap:8px}.say input{flex:1;min-width:0}.msg{min-height:18px;color:var(--muted);font:11px var(--mono);margin-top:9px}.good{color:var(--green)}.bad{color:var(--red)}footer{padding:8px 22px 26px;text-align:center;color:var(--muted);font:11px var(--mono)}@media(max-width:900px){.card,.wide{grid-column:span 6}}@media(max-width:620px){.top{flex-wrap:wrap}.auth{width:100%;margin-left:0}.auth input{flex:1;width:auto}main{padding-top:14px}.card,.wide{grid-column:1/-1}.form,.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><span id="orb" class="dot"></span><span class="brand">JARVIS<b>NANO</b> / V5</span><div class="auth"><input id="pairToken" type="password" autocomplete="off" placeholder="Pairing token (never displayed)"><button id="saveToken">Pair</button><button id="forgetToken">Forget</button></div></header>
<main>
<section class="card wide hero"><h2>Runtime</h2><h1>Systems <b id="healthWord">checking</b></h1><p id="healthLine">Contacting the device.</p></section>
<section class="card"><h2>Voice state</h2><div id="phase" class="state">—</div><div id="voiceKvs" class="grid"></div></section>
<section class="card"><h2>Network</h2><div id="networkKvs" class="grid"></div></section>
<section class="card"><h2>Display</h2><pre id="display">Waiting…</pre></section>
<section class="card"><h2>Touch</h2><pre id="touch">Waiting…</pre></section>
<section class="card"><h2>Tools</h2><pre id="tools">Waiting…</pre></section>
<section class="card full"><h2>Speak to Jarvis</h2><div class="say"><input id="sayText" maxlength="199" placeholder="Type a bounded text turn"><button id="sendSay" class="primary">Send</button></div><div id="actionMsg" class="msg"></div></section>
<section class="card wide"><h2>Configuration</h2><div class="form"><div class="field"><label>Agent name</label><input id="agentName" maxlength="63"></div><div class="field"><label>Wi-Fi SSID</label><input id="wifiSsid" maxlength="32"></div><div class="field"><label>Wi-Fi password</label><input id="wifiPassword" type="password" maxlength="63" autocomplete="new-password" placeholder="Leave blank to preserve"></div><div class="field"><label>Gemini API key</label><input id="llmKey" type="password" maxlength="319" autocomplete="new-password" placeholder="Leave blank to preserve"></div><div class="field"><label>JarvisMCP URL</label><input id="mcpUrl" maxlength="256"></div><div class="field"><label>JarvisMCP key</label><input id="mcpKey" type="password" maxlength="319" autocomplete="new-password" placeholder="Leave blank to preserve"></div></div><div class="actions"><button id="saveConfig" class="primary">Save patch</button><button id="restart">Restart device</button></div><div id="configMsg" class="msg"></div></section>
<section class="card"><h2>Audio tuning</h2><div class="form"><div class="field"><label>Mic dB (0–37)</label><input id="mic" type="number" min="0" max="37" value="24"></div><div class="field"><label>Reference dB (0–37)</label><input id="reference" type="number" min="0" max="37" value="12"></div><div class="field"><label>Volume (0–100)</label><input id="volume" type="number" min="0" max="100" value="100"></div><div class="field"><label>Acoustic barge</label><input id="barge" type="checkbox"></div></div><div class="actions"><button id="applyGain">Apply</button></div></section>
<section class="card full"><h2>Live voice telemetry</h2><pre id="voice">Waiting…</pre></section>
</main>
<footer>Same-origin cockpit · Protected writes require the physical pairing token</footer>
<script>
const $=id=>document.getElementById(id),TOKEN_KEY='jarvisnano_pairing_token';let configReady=false,configBase={};
const configControls=['agentName','wifiSsid','wifiPassword','llmKey','mcpUrl','mcpKey','saveConfig'];function lockConfig(locked){configControls.forEach(id=>$(id).disabled=locked)}
function token(){return localStorage.getItem(TOKEN_KEY)||''}
function show(id,text,bad=false){const e=$(id);e.textContent=text;e.className='msg '+(bad?'bad':'good')}
async function api(path,opt={}){const write=(opt.method||'GET')!=='GET',headers={'Accept':'application/json',...(opt.headers||{})};if(write){headers['Content-Type']='application/json';headers['X-JarvisNano-Token']=token()}const r=await fetch(path,{...opt,headers,cache:'no-store'});let b={};try{b=await r.json()}catch{}if(!r.ok)throw new Error(b.error?.message||`${r.status} ${r.statusText}`);return b}
function pretty(id,v){$(id).textContent=JSON.stringify(v,null,2)}
function kvs(id,obj){$(id).innerHTML=Object.entries(obj).map(([k,v])=>`<div class="kv"><small>${k.replaceAll('_',' ')}</small><strong></strong></div>`).join('');[...$(id).querySelectorAll('strong')].forEach((e,i)=>e.textContent=String(Object.values(obj)[i]??'—'))}
const pollPaths=['/api/health','/api/status','/api/gemini/live','/api/display','/api/touch','/api/tools/status'];
function settled(r){return r.status==='fulfilled'?r.value:{error:r.reason?.message||'Unavailable'}}
let polling=false;async function poll(){if(polling)return;polling=true;try{const results=await Promise.allSettled(pollPaths.map(p=>api(p))),[hr,sr,vr,dr,tr,xr]=results,h=settled(hr),s=settled(sr),v=settled(vr),d=settled(dr),t=settled(tr),x=settled(xr),failed=results.filter(r=>r.status!=='fulfilled').length,coreOk=hr.status==='fulfilled'&&sr.status==='fulfilled'&&vr.status==='fulfilled';$('orb').className=hr.status!=='fulfilled'?'dot bad':failed?'dot':'dot ok';$('healthWord').textContent=!coreOk?'degraded':failed?'partial':'nominal';$('healthLine').textContent=hr.status==='fulfilled'?`Uptime ${Math.floor(h.uptime_ms/1000)}s · Wi-Fi ${h.wifi_connected?'online':'offline'}${failed?` · ${failed} subsystem${failed>1?'s':''} unavailable`:''}`:h.error;if(sr.status==='fulfilled')kvs('networkKvs',{mode:s.wifi_mode||'—',connected:s.wifi_connected,ip:s.ip||'—',rssi:s.rssi??'—'});else kvs('networkKvs',{error:s.error});const runtime=sr.status==='fulfilled'?(s.runtime||{}):{};if(vr.status==='fulfilled'){$('phase').textContent=v.phase||runtime.phase||'unknown';kvs('voiceKvs',{alive:v.voice_task_alive??runtime.voice_task_alive??'—',chunks:v.audio_chunks??'—',reconnects:v.reconnects??'—',errors:v.server_errors??'—'})}else{$('phase').textContent='unavailable';kvs('voiceKvs',{error:v.error})}pretty('voice',v);pretty('display',d);pretty('touch',t);pretty('tools',x)}finally{polling=false}}
async function loadConfig(){configReady=false;lockConfig(true);try{const c=await api('/api/config');configBase={agent_name:c.agent_name||'',wifi_ssid:c.wifi_ssid||'',jarvis_mcp_url:c.jarvis_mcp_url||''};$('agentName').value=configBase.agent_name;$('wifiSsid').value=configBase.wifi_ssid;$('mcpUrl').value=configBase.jarvis_mcp_url;$('wifiPassword').placeholder=c.wifi_password?'Configured · leave blank to preserve':'Not configured';$('llmKey').placeholder=c.llm_api_key?'Configured · leave blank to preserve':'Not configured';$('mcpKey').placeholder=c.jarvis_mcp_key?'Configured · leave blank to preserve':'Not configured';configReady=true}catch(e){show('configMsg',e.message,true)}finally{lockConfig(false)}}
$('saveToken').onclick=()=>{const v=$('pairToken').value.trim();if(!v)return;localStorage.setItem(TOKEN_KEY,v);$('pairToken').value='';show('actionMsg','Pairing token stored locally. It will not be displayed.')};
$('forgetToken').onclick=()=>{localStorage.removeItem(TOKEN_KEY);$('pairToken').value='';show('actionMsg','Pairing token forgotten.')};
$('sendSay').onclick=async()=>{try{const text=$('sayText').value.trim();if(!text)throw new Error('Enter a text turn.');await api('/api/gemini/say',{method:'POST',body:JSON.stringify({text})});$('sayText').value='';show('actionMsg','Text turn queued.')}catch(e){show('actionMsg',e.message,true)}};
$('saveConfig').onclick=async()=>{let posted=false;try{if(!configReady)throw new Error('Configuration is not loaded yet.');const p={},next={agent_name:$('agentName').value,wifi_ssid:$('wifiSsid').value,jarvis_mcp_url:$('mcpUrl').value};for(const [k,v] of Object.entries(next))if(v!==configBase[k])p[k]=v;if($('wifiPassword').value)p.wifi_password=$('wifiPassword').value;if($('llmKey').value)p.llm_api_key=$('llmKey').value;if($('mcpKey').value)p.jarvis_mcp_key=$('mcpKey').value;if(!Object.keys(p).length)throw new Error('No configuration changes.');configReady=false;lockConfig(true);await api('/api/config',{method:'POST',body:JSON.stringify(p)});posted=true;$('wifiPassword').value=$('llmKey').value=$('mcpKey').value='';show('configMsg','Configuration saved.');await loadConfig()}catch(e){if(!posted){configReady=true;lockConfig(false)}show('configMsg',e.message,true)}};
$('applyGain').onclick=async()=>{try{await api('/api/audio/gain',{method:'POST',body:JSON.stringify({mic:+$('mic').value,reference:+$('reference').value,volume:+$('volume').value,barge_enabled:$('barge').checked})});show('actionMsg','Audio settings queued.')}catch(e){show('actionMsg',e.message,true)}};
$('restart').onclick=async()=>{if(!confirm('Restart JarvisNano?'))return;try{await api('/api/restart',{method:'POST',body:'{}'});show('configMsg','Restart queued.')}catch(e){show('configMsg',e.message,true)}};
$('sayText').addEventListener('keydown',e=>{if(e.key==='Enter')$('sendSay').click()});
loadConfig();poll();setInterval(poll,2500);
</script>
</body>
</html>
