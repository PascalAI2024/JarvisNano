# Secret + private-identifier scan. CI: .github/workflows/secret-scan.yml.
# Local opt-in: scripts/hooks/install.sh (pre-push).
title = "JarvisNano public-repo guard"

[extend]
useDefault = true   # all stock gitleaks provider-key rules

[[rules]]
id = "private-host-suffix"
description = "Private company or VPS hostname suffix"
regex = '''(?i)\b[a-z0-9-]+(\.[a-z0-9-]+)*\.(igddev\.com|internal|ts\.net|corp|lan)\b'''
tags = ["private-host"]

[[rules]]
id = "cgnat-tailscale-ip"
description = "Tailscale/CGNAT address (100.64.0.0/10)"
regex = '''\b100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}\b'''
tags = ["private-host"]

[[rules]]
id = "lan-ip"
description = "RFC1918 address (use 192.0.2.x / 198.51.100.x in fixtures)"
regex = '''\b(10(\.[0-9]{1,3}){3}|172\.(1[6-9]|2[0-9]|3[01])(\.[0-9]{1,3}){2}|192\.168(\.[0-9]{1,3}){2})\b'''
tags = ["private-host"]

[[rules]]
id = "absolute-local-path"
description = "Absolute path into a personal home directory"
regex = '''(?i)(C:\\+Users\\+[A-Za-z0-9._-]+|/home/[a-z][a-z0-9_-]+/|/Users/[A-Za-z0-9._-]+/)'''
tags = ["local-path"]

[[rules]]
id = "private-env-url"
description = "Bearer or basic-auth credential embedded in a URL"
regex = '''https?://[^\s/:@]+:[^\s/@]{6,}@[A-Za-z0-9.-]+'''
tags = ["credential"]

[allowlist]
description = "Documented placeholders and the files that define the patterns"
paths = [
  '''^\.gitleaks\.toml$''',
  '''^scripts/check_secrets\.py$''',
  '''^docs/security/''',
  '''^CLAUDE\.md$''',
  '''^components/jr_memory/(src/jr_memory_guard\.c|tests/test_guard\.c)$''',
]
regexes = [
  '''192\.0\.2\.[0-9]+''',
  '''198\.51\.100\.[0-9]+''',
  '''203\.0\.113\.[0-9]+''',
  '''[a-z0-9.-]+\.(example|test|invalid)\b''',
  '''device\.local''',
  '''/home/(user|runner)/''',
  '''YOUR_[A-Z_]+''',
]
